<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우가투스투스의 비밀 미션</title>
<style>
  :root{
    --accent:#E2761B; --accent-dark:#A9500C; --accent-soft:#FBE7CF;
    --cave-1:#241a13; --cave-2:#3b2b1e; --cave-3:#4d3925;
    --paper:#F7EFE0; --paper-2:#EFE3CD; --ink:#2C2118; --ink-soft:#6B5844;
    --ok:#2E7D4F; --bad:#C0392B;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #5a4229 0%, transparent 60%),
      linear-gradient(170deg, var(--cave-2) 0%, var(--cave-1) 100%);
    background-attachment:fixed;
    min-height:100vh;
    font-size:17px; line-height:1.6;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--accent);color:#fff;font-weight:800;
    padding:8px 15px;border-radius:999px;font-size:15px;
    box-shadow:0 3px 0 var(--accent-dark);
  }
  .who{color:#E8D9BE;font-size:14px;font-weight:600;margin-left:auto}
  .steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .pip{height:8px;border-radius:99px;background:#6b5742;flex:1;min-width:14px;transition:background .25s}
  .pip.on{background:var(--accent)}
  .stage-label{color:#D9C7A8;font-size:13px;font-weight:700;letter-spacing:.02em}

  /* ---------- panels ---------- */
  .panel{
    background:var(--paper);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.05);
  }
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em;line-height:1.25}
  h2{font-size:22px;margin:0 0 10px;line-height:1.3}
  .sub{color:var(--ink-soft);font-size:15px;margin:0 0 18px}
  .center{text-align:center}

  /* ---------- character ---------- */
  .hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .hero .art{flex:0 0 132px;margin:0 auto}
  .hero .say{flex:1 1 260px;min-width:0}
  .bubble{
    position:relative;background:#fff;border:3px solid var(--ink);
    border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:17px;font-weight:600;
  }
  .bubble:after{
    content:'';position:absolute;left:-13px;top:22px;width:0;height:0;
    border:10px solid transparent;border-right-color:var(--ink);
  }

  /* ---------- form ---------- */
  label{display:block;font-weight:800;margin:16px 0 6px;font-size:16px}
  input[type=text], input[type=number]{
    width:100%;padding:15px 16px;font-size:18px;border-radius:14px;
    border:2px solid #cbb89a;background:#fff;font-family:inherit;color:var(--ink);
  }
  input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
  .err{color:var(--bad);font-weight:700;font-size:15px;margin-top:10px;min-height:22px}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:60px;padding:14px 22px;
    font-size:20px;font-weight:800;font-family:inherit;
    color:#fff;background:var(--accent);border:0;border-radius:16px;
    box-shadow:0 5px 0 var(--accent-dark);cursor:pointer;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark)}
  .btn[disabled]{background:#9c8d7c;box-shadow:0 5px 0 #7a6d5e;cursor:progress}
  .btn.ghost{
    background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9b79a;border:2px solid #c9b79a;
  }
  .btn.ghost:active{box-shadow:0 1px 0 #c9b79a}
  .btn.small{min-height:48px;font-size:16px;width:auto;padding:10px 18px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btnrow .btn{flex:1 1 200px}

  /* ---------- info step ---------- */
  .stepbox{background:#fff;border-radius:16px;padding:22px;border:2px dashed #cbb89a;min-height:120px;display:flex;align-items:center}
  .steptext{font-size:22px;font-weight:700;line-height:1.55;margin:0}

  /* 말 미션: 글자 없이 '듣고 있는 중'만 보여 줍니다 */
  .listen{
    background:#fff;border-radius:16px;border:2px dashed #cbb89a;
    padding:26px 22px;text-align:center;
  }
  .listen .cap{font-size:15px;color:var(--ink-soft);font-weight:700;margin:0 0 4px}
  .listen .nth{font-size:26px;font-weight:900;margin:0 0 18px}
  .wave{display:flex;gap:7px;align-items:flex-end;justify-content:center;height:56px}
  .wave i{width:9px;border-radius:99px;background:var(--accent);height:14px;opacity:.45}
  .wave.on i{animation:talk .9s ease-in-out infinite}
  .wave.on i:nth-child(1){animation-delay:0s}
  .wave.on i:nth-child(2){animation-delay:.12s}
  .wave.on i:nth-child(3){animation-delay:.24s}
  .wave.on i:nth-child(4){animation-delay:.36s}
  .wave.on i:nth-child(5){animation-delay:.48s}
  .wave.on i:nth-child(6){animation-delay:.6s}
  .wave.on i:nth-child(7){animation-delay:.72s}
  @keyframes talk{0%,100%{height:14px;opacity:.45}50%{height:52px;opacity:1}}
  .listen .state{font-size:17px;font-weight:800;margin:14px 0 0;min-height:26px}
  .prog{height:12px;background:#EDE5D6;border-radius:99px;overflow:hidden;margin:16px 0 0;display:block}
  .progfill{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s linear}
  @media (prefers-reduced-motion: reduce){ .wave.on i{animation:none;height:32px;opacity:1} }
  .mural{width:100%;border-radius:14px;display:block;background:#2b2118;cursor:zoom-in}
  .muralcap{color:var(--ink-soft);font-size:14px;margin:10px 0 0;text-align:center}

  /* ---------- diary ---------- */
  .diary{
    background:linear-gradient(#FBF4E4,#F1E4C8);
    border-radius:14px;padding:22px;border:1px solid #d8c5a0;
    box-shadow:inset 0 0 40px rgba(150,110,60,.18);
    font-size:17.5px;line-height:1.95;
  }
  .diary p{margin:0 0 14px}
  .diary p:last-child{margin-bottom:0}
  .diary .lead{font-weight:800;font-size:19px}
  .modal{
    position:fixed;inset:0;background:rgba(15,10,6,.88);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal .inner{background:var(--paper);border-radius:16px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  .modal img{width:100%;border-radius:12px}
  .confirmlist{margin:14px 0 4px;padding-left:20px;line-height:1.9;font-size:16px}
  .confirmlist li{margin-bottom:2px}

  /* ---------- material cards ---------- */
  .cat{margin:22px 0 0}
  .cat h3{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .cat .chint{color:var(--ink-soft);font-size:14px;margin:0 0 10px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  .grid.wide{grid-template-columns:1fr}
  @media(min-width:560px){ .grid{grid-template-columns:repeat(3,1fr)} .grid.wide{grid-template-columns:repeat(2,1fr)} }
  @media(min-width:860px){ .grid{grid-template-columns:repeat(5,1fr)} .grid.wide{grid-template-columns:repeat(2,1fr)} }
  .card{
    background:#fff;border:3px solid #ddcdb0;border-radius:14px;padding:8px;
    cursor:pointer;text-align:center;transition:border-color .12s, transform .08s, box-shadow .12s;
    position:relative;display:flex;flex-direction:column;
  }
  .card:active{transform:scale(.97)}
  .card img{width:100%;height:110px;object-fit:contain;display:block;background:#fff;border-radius:8px}
  .grid.wide .card img{height:74px}
  .card .cl{font-size:13px;font-weight:700;margin-top:7px;line-height:1.35;color:var(--ink)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft), 0 6px 14px rgba(0,0,0,.14)}
  .card .tick{
    position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:18px;font-weight:900;
    display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .card.sel .tick{display:flex}
  /* 아래에 붙어 따라다니는 제출 막대입니다.
     예전에는 바탕이 거의 비쳐서, 막대에 가려진 카드를 누르려다
     제출 단추가 눌리는 일이 있었습니다. 그래서 바탕을 불투명하게 하고
     위쪽에 선을 그어 '여기부터는 단추'임을 분명히 했습니다. */
  .picked{
    position:sticky;bottom:0;margin-top:18px;padding:14px 0 10px;z-index:6;
    background:var(--paper);
    box-shadow:0 -10px 14px -6px rgba(0,0,0,.10);
    border-top:2px solid rgba(0,0,0,.10);
  }
  /* 마지막 재료 줄이 제출 막대 뒤로 숨지 않도록 빈 자리를 남겨 둡니다. */
  .cat:last-of-type{ padding-bottom:16px }
  .pickcount{font-weight:800;text-align:center;margin-bottom:10px;font-size:16px}
  .picked .btnrow{margin-top:0}
  .picked .btnrow .btn{flex:1 1 160px}

  /* ---------- result ---------- */
  .score{
    font-size:64px;font-weight:900;line-height:1;text-align:center;margin:6px 0 2px;color:var(--accent);
  }
  .score small{font-size:24px;font-weight:800}
  .verdict{text-align:center;font-size:26px;font-weight:900;margin:8px 0 4px}
  .vsub{text-align:center;color:var(--ink-soft);margin:0 0 18px;font-size:15px}
  .rlist{list-style:none;padding:0;margin:0}
  .rlist li{
    display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;
    background:#fff;margin-bottom:8px;font-weight:700;font-size:16px;
  }
  .rlist li .mk{font-size:20px;flex:0 0 auto}
  .rlist li.no{background:#FBE9E7}
  .rlist li .sm{font-weight:600;color:var(--ink-soft);font-size:14px;margin-left:auto;text-align:right}
  .hint{
    background:#fff;border:2px dashed #cbb89a;border-radius:14px;
    padding:18px 16px;text-align:center;margin-top:6px;
  }
  .hintline{font-size:17px;font-weight:800;margin:0 0 4px}
  .hintsub{font-size:14.5px;color:var(--ink-soft);margin:0}
  .divider{height:1px;background:#d9c9ac;margin:22px 0}
  .opt{
    display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #ddcdb0;
    border-radius:14px;padding:14px;margin-bottom:9px;cursor:pointer;font-weight:700;font-size:16px;
  }
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}

  /* ---------- notices ---------- */
  .notice{border-radius:14px;padding:14px 16px;font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.55}
  .notice.warn{background:#FFF3CD;border:2px solid #E6C34A;color:#6B4E00}
  .notice.bad{background:#FBE3E0;border:2px solid #E3A49C;color:#8A2317}
  .notice.good{background:#E4F3E9;border:2px solid #9CCBAE;color:#1E5C38}
  .foot{color:#C9B79A;font-size:13px;text-align:center;margin-top:20px;line-height:1.7}

  .spinner{
    width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.45);
    border-top-color:#fff;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .confetti i{position:absolute;width:10px;height:16px;opacity:.95;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
  @media (prefers-reduced-motion: reduce){ .confetti{display:none} .pop{animation:none} }
</style>
</head>

var Store = {
  configured:function(){ return !!(CONFIG.SHEET_ENDPOINT && CONFIG.SHEET_ENDPOINT.indexOf("http") === 0); },

  /* JSONP: Canva/학교망의 CORS 제한을 피하기 위한 기본 전송 방식 */
  jsonp:function(params){
    return new Promise(function(resolve, reject){
      var cb = "ugcb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
      var timer = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 12000);
      function cleanup(){
        clearTimeout(timer);
        try { delete window[cb]; } catch(e){ window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      window[cb] = function(data){ cleanup(); resolve(data); };
      var q = [];
      for (var k in params){ if (params[k] !== undefined && params[k] !== null) q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k])); }
      q.push("callback="+cb);
      var s = document.createElement("script");
      s.src = CONFIG.SHEET_ENDPOINT + (CONFIG.SHEET_ENDPOINT.indexOf("?")>=0?"&":"?") + q.join("&");
      s.onerror = function(){ cleanup(); reject(new Error("network")); };
      document.head.appendChild(s);
    });
  },

  send:function(params){
    if (!this.configured()) return Promise.reject(new Error("not_configured"));
    var self = this;
    return this.jsonp(params).then(function(res){
      if (!res || res.ok !== true) throw new Error((res && res.error) || "server");
      return res;
    }).catch(function(e){
      /* JSONP가 막힌 환경을 위한 2차 시도 */
      return fetch(CONFIG.SHEET_ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body:JSON.stringify(params)
      }).then(function(r){ return r.json(); }).then(function(res){
        if (!res || res.ok !== true) throw new Error((res && res.error) || "server");
        return res;
      });
    });
  },

  local:function(){
    try { return JSON.parse(localStorage.getItem("ugatustus_records_v1") || "[]"); }
    catch(e){ return []; }
  },
  saveLocal:function(rec){
    try {
      var all = this.local(); all.push(rec);
      localStorage.setItem("ugatustus_records_v1", JSON.stringify(all.slice(-500)));
    } catch(e){}
  },
  patchLocal:function(id, patch){
    try {
      var all = this.local();
      for (var i=0;i<all.length;i++){ if (all[i].기록ID === id){ for (var k in patch) all[i][k] = patch[k]; } }
      localStorage.setItem("ugatustus_records_v1", JSON.stringify(all));
    } catch(e){}
  },
  attemptNo:function(name, num){
    var all = this.local(), n = 1;
    for (var i=0;i<all.length;i++){
      if (all[i].이름 === name && String(all[i].번호) === String(num) && all[i].미션 === M.name) n++;
    }
    return n;
  },
  remember:function(name, num){
    try { localStorage.setItem("ugatustus_student", JSON.stringify({name:name, num:num})); } catch(e){}
  },
  recall:function(){
    try { return JSON.parse(localStorage.getItem("ugatustus_student") || "null"); } catch(e){ return null; }
  }
};

/* ============================================================
   채점
   ============================================================ */
function grade(){
  var right = 0, wrong = 0, per = {};
  CATEGORIES.forEach(function(c){ per[c.id] = { got:null, ok:false }; });
  CARDS.forEach(function(c){
    if (!S.selected[c.id]) return;
    if (ANSWER[c.cat] === c.id){ right++; per[c.cat].ok = true; per[c.cat].got = c.id; }
    else { wrong++; if (!per[c.cat].got) per[c.cat].got = c.id; }
  });
  var score = Math.max(0, right*25 - wrong*5);
  var verdict, vsub, tone;
  /* 판정 문구에도 몇 개가 틀렸는지 드러나지 않게 합니다. */
  if (score >= 90)      { verdict = "🎉 미션 성공!";                          vsub = "우가투스투스의 돌도끼와 똑같아요!"; tone = "good"; }
  else if (score >= 70) { verdict = "👍 거의 성공!";                          vsub = "아주 가까워요!"; tone = "good"; }
  else if (score >= 50) { verdict = "🤔 다시 생각해 봐요!";                   vsub = "기억을 한 번 더 더듬어 볼까요?"; tone = "warn"; }
  else                  { verdict = "🔎 우가투스투스의 정보를 다시 확인해 봐요!"; vsub = "괜찮아요. 한 번 더 도전할 수 있어요."; tone = "warn"; }
  return { score:score, right:right, wrong:wrong, per:per, verdict:verdict, vsub:vsub, tone:tone,
           success:(score >= 90) };
}

  if (S.reflectState === "error") out += '<div class="notice bad" style="margin-top:14px">저장하지 못했어요. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.</div>';

  out += '<div class="btnrow">'
      +    '<button class="btn" id="sendReflect"' + (S.reflectState === "saving" ? ' disabled' : '') + '>'
      +      (S.reflectState === "saving" ? '<span class="spinner"></span> 보내는 중…' : (S.reflectState === "saved" ? '다시 보내기' : '선생님께 보내기'))
      +    '</button>'
      +    '<button class="btn ghost" id="retry">🔁 다시 도전하기</button>'
      +  '</div>';

  out += '</div>';
  out += '<p class="foot">우리는 지금 <b>문자가 필요한 까닭</b>을 알아보기 위한 첫 번째 미션을 해결했습니다.<br>이제 교과서와 함께 문자가 우리 생활에서 왜 필요한지 알아봅시다.</p>';
  return out;
}

/* ============================================================
   음성 (말 미션)
   ============================================================ */
/* 소리를 내는 방법이 두 가지입니다.
   ① audio/ 폴더에 미리 만들어 둔 음성 파일  ← 기본. 어떤 브라우저에서도 납니다.
   ② 브라우저의 음성 읽기 기능(Web Speech)   ← ①이 없거나 실패할 때만.
   카카오톡·클래스팅 같은 앱 안 브라우저에는 ②가 아예 없어서 ①이 필요합니다. */
var AUDIO_BASE = "audio/";
var audioEl = null;        // 지금 재생 중인 음성
var audioUsable = null;    // null=아직 모름, true/false=확인됨

function webSpeechSupported(){
  return typeof window !== "undefined" && "speechSynthesis" in window
      && typeof SpeechSynthesisUtterance !== "undefined";
}
/* 둘 중 하나라도 되면 소리를 낼 수 있습니다. 파일 쪽은 실제로 틀어 봐야 알 수 있어
   아직 확인 전(null)이면 일단 가능하다고 봅니다. */
function ttsSupported(){
  return audioUsable !== false || webSpeechSupported();
}
function audioUrl(name){ return AUDIO_BASE + name; }
function koVoice(){
  try {
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i=0;i<vs.length;i++){ if ((vs[i].lang||"").toLowerCase().indexOf("ko") === 0) return vs[i]; }
  } catch(e){}
  return null;
}
function setSpeaking(on){
  S.speaking = on;
  var w = el("wave"), st = el("sstate");
  if (w) w.classList.toggle("on", on);
  if (st) st.textContent = on ? "잘 들어 보세요…" : "다 들었어요";
}
/* 브라우저 음성 읽기 — 음성 파일을 못 쓸 때만 씁니다. */
function speakWeb(text){
  if (!webSpeechSupported()){ setSpeaking(false); audioUsable = false; render(); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 1.15; u.pitch = 0.9;
    var v = koVoice(); if (v) u.voice = v;
    u.onstart = function(){ setSpeaking(true); };
    u.onend   = function(){ setSpeaking(false); };
    u.onerror = function(){ setSpeaking(false); };
    setSpeaking(true);
    window.speechSynthesis.speak(u);
  } catch(e){ setSpeaking(false); }
}

/* 미리 만들어 둔 음성 파일을 먼저 틉니다. 실패하면 브라우저 음성으로 넘어갑니다. */
function playFile(name, fallbackText){
  stopSpeak();
  try {
    var a = new Audio(audioUrl(name));
    audioEl = a;
    a.onplaying = function(){ audioUsable = true; setSpeaking(true); };
    a.onended   = function(){ setSpeaking(false); };
    a.onerror   = function(){ audioUsable = false; speakWeb(fallbackText); };
    setSpeaking(true);
    var p = a.play();
    if (p && p.catch) p.catch(function(){ audioUsable = false; speakWeb(fallbackText); });
  } catch(e){
    audioUsable = false;
    speakWeb(fallbackText);
  }
}

var STORY_FILE = "story.wav";
function storyText(){ return SPEECH_STEPS.join(" "); }

/* 이야기를 처음부터 끝까지 한 번에 재생합니다. 진행 막대로 얼마나 남았는지만 보여 주고,
   끝나야 다음으로 넘어갈 수 있습니다. */
function playStory(){
  stopSpeak();
  S.storyDone = false;
  S.storyProgress = 0;
  try {
    var a = new Audio(audioUrl(STORY_FILE));
    audioEl = a;
    a.onplaying = function(){ audioUsable = true; setSpeaking(true); };
    a.ontimeupdate = function(){
      if (S.storyDone) return;
      if (a.duration && isFinite(a.duration)){
        S.storyProgress = a.currentTime / a.duration;
        var f = el("progfill");
        if (f) f.style.width = Math.round(S.storyProgress * 100) + "%";
      }
    };
    a.onended = function(){ S.storyProgress = 1; finishStory(); };
    a.onerror = function(){ audioUsable = false; speakStoryWeb(); };
    setSpeaking(true);
    var p = a.play();
    if (p && p.catch) p.catch(function(){ audioUsable = false; speakStoryWeb(); });
  } catch(e){
    audioUsable = false;
    speakStoryWeb();
  }
}

/* 음성 파일을 못 쓸 때의 차선책 */
function speakStoryWeb(){
  if (!webSpeechSupported()){ setSpeaking(false); audioUsable = false; finishStory(); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(storyText());
    u.lang = "ko-KR"; u.rate = 1.15; u.pitch = 0.9;
    var v = koVoice(); if (v) u.voice = v;
    u.onstart = function(){ setSpeaking(true); };
    u.onend   = function(){ finishStory(); };
    u.onerror = function(){ finishStory(); };
    setSpeaking(true);
    window.speechSynthesis.speak(u);
  } catch(e){ finishStory(); }
}

function finishStory(){
  S.speaking = false;
  S.storyDone = true;
  render();
}

/* 한 단계가 길어 파일도 큽니다. 미리 받아 두어야 [다음]을 눌렀을 때 기다리지 않습니다. */
var preloaded = {};
function preload(name){
  if (!name || preloaded[name]) return;
  try {
    var a = new Audio();
    a.preload = "auto";
    a.src = audioUrl(name);
    a.load();
    preloaded[name] = a;
  } catch(e){}
}

function stopSpeak(){
  try { window.speechSynthesis.cancel(); } catch(e){}
  try { if (audioEl){ audioEl.pause(); audioEl.onerror = null; audioEl = null; } } catch(e){}
  S.speaking = false;
}

/* ============================================================
   동작
   ============================================================ */
document.addEventListener("submit", function(e){
  if (e.target.id !== "f") return;
  e.preventDefault();
  var nm = el("nm").value.trim(), no = el("no").value.trim();
  if (!nm){ el("er").textContent = "이름을 먼저 써 주세요."; el("nm").focus(); return; }
  if (!no){ el("er").textContent = "번호를 먼저 써 주세요."; el("no").focus(); return; }
  S.name = nm; S.num = no;
  Store.remember(nm, no);
  S.attempt = Store.attemptNo(nm, no);
  S.startedAt = Date.now();
  S.stepIndex = 0;
  S.screen = "info";
  render();
});

document.addEventListener("click", function(e){
  var t = e.target;

  if (t.closest && t.closest("#soundcheck")){ playFile("soundcheck.wav", "잘 들리니? 그럼 시작해 보자!"); return; }


  if (t.closest && t.closest("#next")){
    stopSpeak();
    S.stepIndex++;
    render();
    return;
  }

  if (t.closest && t.closest("#go")){
    stopSpeak();
    S.visitedSelect = true;
    S.screen = "select";
    render();
    return;
  }

  if (t.closest && t.closest("#mu")){
    openModal('<img src="' + MURALS[S.stepIndex] + '" alt="벽화 크게 보기">');
    return;
  }

  if (t.closest && t.closest("#backToDiary")){
    /* 팝업이 아니라 일기 화면으로 실제로 돌아갑니다. 고른 재료는 S.selected 에
       그대로 있어 돌아오면 선택이 유지됩니다. */
    S.screen = "info";
    render();
    return;
  }

  if (t.id === "mclose" || t.id === "mback"){ closeModal(); return; }

  var card = t.closest && t.closest(".card");
  if (card){
    var id = card.getAttribute("data-id");
    if (S.selected[id]) delete S.selected[id]; else S.selected[id] = true;
    card.classList.toggle("sel");
    card.setAttribute("aria-pressed", S.selected[id] ? "true" : "false");
    if (el("cnt")) el("cnt").textContent = Object.keys(S.selected).length;
    return;
  }

  if (t.closest && t.closest("#submit")){ askSubmit(); return; }
  if (t.id === "confirmNo"){ closeModal(); return; }
  if (t.id === "confirmYes"){ closeModal(); submit(); return; }

  var opt = t.closest && t.closest(".opt");
  if (opt && S.screen === "result"){
    var key = opt.getAttribute("data-opt");
    var label = (key === "etc") ? "기타" : REFLECT_OPTIONS[Number(key)];
    if (S.reflectPicked[label]) delete S.reflectPicked[label]; else S.reflectPicked[label] = true;
    if (S.reflectState === "saved" || S.reflectState === "error") S.reflectState = "idle";
    var v = el("etc") ? el("etc").value : S.reflectEtc;
    S.reflectEtc = v;
    render();
    return;
  }

  if (t.closest && t.closest("#sendReflect")){ sendReflect(); return; }

  if (t.closest && t.closest("#retry")){
    S.selected = {}; S.result = null; S.recordId = null; S.saveError = null;
    S.reflectPicked = {}; S.reflectEtc = ""; S.reflectState = "idle";
    S.attempt = Store.attemptNo(S.name, S.num);
    S.stepIndex = 0; S.storyStarted = false; S.storyDone = false; S.storyProgress = 0;
    S.visitedSelect = false;
    S.startedAt = Date.now(); S.screen = "info";
    render();
    return;
  }
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card")){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener("input", function(e){
  if (e.target.id === "etc") S.reflectEtc = e.target.value;
});

function openModal(inner){
  var d = document.createElement("div");
  d.className = "modal"; d.id = "modal";
  d.innerHTML = '<div class="inner">' + inner
    + '<div class="btnrow"><button class="btn" id="mclose">닫기</button></div></div>';
  d.addEventListener("click", function(ev){ if (ev.target === d) closeModal(); });
  document.body.appendChild(d);
}
function closeModal(){ var m = el("modal"); if (m) m.remove(); }

/* 제출하기 전에 한 번 더 묻습니다.
   한 번 제출하면 점수가 나오고 되돌릴 수 없는데, 아래 제출 막대가
   마지막 줄 카드와 가까워 잘못 눌리는 일이 있었습니다. */
function askSubmit(){
  var list = "";
  CATEGORIES.forEach(function(cat){
    var mine = CARDS.filter(function(c){ return c.cat === cat.id && S.selected[c.id]; });
    list += '<li><b>' + esc(cat.name) + '</b> — '
          + (mine.length ? mine.map(function(c){ return esc(c.label); }).join(", ") : "고르지 않음")
          + '</li>';
  });
  var d = document.createElement("div");
  d.className = "modal"; d.id = "modal";
  d.innerHTML = '<div class="inner">'
    + '<h2>이대로 제출할까요?</h2>'
    + '<p class="sub">제출하면 점수가 나오고, 고른 재료를 바꿀 수 없어요.</p>'
    + '<ul class="confirmlist">' + list + '</ul>'
    + '<div class="btnrow">'
    +   '<button class="btn ghost" id="confirmNo">아니요, 더 볼래요</button>'
    +   '<button class="btn" id="confirmYes">네, 제출할게요</button>'
    + '</div></div>';
  d.addEventListener("click", function(ev){ if (ev.target === d) closeModal(); });
  document.body.appendChild(d);
}

/* ---------- 제출 ---------- */
function submit(){
  if (S.submitting) return;                       // 중복 클릭 방지
  var picked = Object.keys(S.selected);
  /* 버튼을 막아 두었지만, 실수로 두 번 눌리거나 하는 일이 없도록 여기서도 확인합니다.
     한 번 제출하면 점수가 나오고 되돌릴 수 없으므로 반드시 네 가지를 다 골라야 합니다. */
  var missing = CATEGORIES.filter(function(cat){
    return !CARDS.some(function(c){ return c.cat === cat.id && S.selected[c.id]; });
  });
  if (missing.length > 0){
    S.saveError = "아직 고르지 않은 것이 있어요 — "
                + missing.map(function(c){ return c.name; }).join(", ")
                + ". 네 가지를 모두 고른 뒤에 제출하세요.";
    render();
    return;
  }
  S.submitting = true; S.saveError = null;
  render();

  var r = grade();
  r.seconds = Math.max(1, Math.round((Date.now() - S.startedAt)/1000));
  var id = "r" + Date.now() + "_" + Math.floor(Math.random()*100000);
  var rec = {
    기록ID: id,
    제출일시: new Date().toISOString(),
    이름: S.name, 번호: S.num, 미션: M.name,
    점수: r.score,
    성공여부: r.success ? "성공" : "미완성",
    정답개수: r.right, 오답개수: r.wrong,
    "소요시간(초)": r.seconds,
    시도: S.attempt,
    선택한답: picked.map(function(p){
      var c = CARDS.filter(function(x){ return x.id === p; })[0];
      return CAT_NAME[c.cat] + ":" + c.label;
    }).join(" / "),
    어려웠던점: ""
  };

  var payload = { action:"submit" };
  for (var k in rec) payload[k] = rec[k];

  function done(){
    Store.saveLocal(rec);
    S.recordId = id;
    S.result = r;
    S.submitting = false;
    S.saveError = null;
    S.screen = "result";
    render();
    if (r.success) confetti();
  }

  if (!Store.configured()){
    // 저장 주소가 없을 때: 이 기기에만 저장하고, 첫 화면에서 이미 안내했습니다.
    setTimeout(done, 350);
    return;
  }

  Store.send(payload).then(function(){
    done();
  }).catch(function(){
    S.submitting = false;
    S.saveError = "결과를 저장하는 중 문제가 발생했습니다. 인터넷 연결을 확인한 후 다시 제출해 주세요.";
    render();
    var b = el("submit"); if (b) b.scrollIntoView({behavior:"smooth", block:"center"});
  });
}

/* ---------- 어려웠던 점 보내기 ---------- */
function sendReflect(){
  if (S.reflectState === "saving") return;
  var picks = Object.keys(S.reflectPicked);
  if (!picks.length){
    S.reflectState = "error";
    render();
    return;
  }
  var text = picks.map(function(p){
    return (p === "기타" && S.reflectEtc) ? ("기타: " + S.reflectEtc) : p;
  }).join(" / ");

  S.reflectState = "saving"; render();
  Store.patchLocal(S.recordId, { 어려웠던점: text });

  if (!Store.configured()){
    setTimeout(function(){ S.reflectState = "saved"; render(); }, 300);
    return;
  }
  Store.send({ action:"reflect", 기록ID:S.recordId, 어려웠던점:text }).then(function(){
    S.reflectState = "saved"; render();
  }).catch(function(){
    S.reflectState = "error"; render();
  });
}

/* ---------- 성공 효과 ---------- */
function confetti(){
  var box = document.createElement("div");
  box.className = "confetti";
  var colors = [M.accent, "#F2C14E", "#8FBF6A", "#fff", "#E07A5F"];
  for (var i=0;i<60;i++){
    var p = document.createElement("i");
    p.style.left = Math.random()*100 + "vw";
    p.style.top = (-10 - Math.random()*30) + "vh";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.8 + Math.random()*1.6) + "s";
    p.style.animationDelay = (Math.random()*0.5) + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 4200);
}

render();
</script>
